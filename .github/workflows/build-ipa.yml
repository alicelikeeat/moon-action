name: Build unsigned IPA

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Liquid Glass SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Version (single source of truth)
        run: |
          # project.yml MARKETING_VERSION supplies MAJOR.MINOR; CI assigns PATCH = run number,
          # so every IPA shows a unique version in installers/signers (they only show the version).
          BASE=$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9]+\.[0-9]+).*/\1/p' project.yml | head -1)
          test -n "$BASE" || { echo "MARKETING_VERSION not found"; exit 1; }
          APP_BUILD=${{ github.run_number }}
          APP_VERSION="$BASE.$APP_BUILD"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$APP_BUILD" >> "$GITHUB_ENV"
          echo "Building Moon Action $APP_VERSION ($APP_BUILD)"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project MoonAction.xcodeproj -scheme MoonAction -clonedSourcePackagesDirPath spm

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild -project MoonAction.xcodeproj -scheme MoonAction -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build -clonedSourcePackagesDirPath spm \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/MoonAction.app || { grep -n "error:" build.log | head -80; exit 1; }

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MoonAction.app Payload/
          ls Payload/MoonAction.app/Frameworks || true
          # Read the version back from the built app and refuse to publish on mismatch.
          PLIST=Payload/MoonAction.app/Info.plist
          V=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")
          B=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")
          echo "Info.plist: CFBundleShortVersionString=$V CFBundleVersion=$B"
          if [ "$V" != "$APP_VERSION" ] || [ "$B" != "$APP_BUILD" ]; then
            echo "::error::Version mismatch: built $V ($B), expected $APP_VERSION ($APP_BUILD)"; exit 1
          fi
          IPA_NAME="MoonAction-$V-unsigned.ipa"
          zip -qry "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          ls -lh "$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Moon Action ${{ env.APP_VERSION }} · unsigned IPA
          target_commitish: ${{ github.sha }}
          files: ${{ env.IPA_NAME }}
          body: |
            **Version ${{ env.APP_VERSION }} · build ${{ env.APP_BUILD }}** (CFBundleShortVersionString / CFBundleVersion, verified from the built Info.plist) · commit ${{ github.sha }}

            Unsigned iOS build of **Moon Action** — an original portrait 3D card battle game.

            * Portrait, over-the-shoulder 3D camera, procedurally generated cel-shaded fighters
            * Card system: Strike · Blast · Special Art · Ultimate Art · Effect cards · Eclipse Rush team finisher
            * Native iOS 26 Liquid Glass UI

            This IPA is **not signed**. Sideload it with a tool that re-signs the app
            (e.g. AltStore, Sideloadly, or TrollStore on supported devices). Requires iOS 15+.

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project MoonAction.xcodeproj -scheme MoonAction -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild -clonedSourcePackagesDirPath spm \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -3

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,dev) for rt,devs in d.items() if "iOS" in rt for dev in devs if "iPhone" in dev["name"] and "Pro" in dev["name"] and "Max" not in dev["name"]]
          c.sort(key=lambda x:x[0])
          print(c[-1][1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          for i in $(seq 1 60); do xcrun simctl list devices | grep "$UDID" | grep -q Booted && break; sleep 3; done
          xcrun simctl list devices | grep "$UDID"

      - name: Unit tests (simulator)
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild test -project MoonAction.xcodeproj -scheme MoonAction -configuration Debug \
            -destination "id=$UDID" -derivedDataPath testbuild -clonedSourcePackagesDirPath spm \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "Test Case .*(passed|failed)|error:|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Simulator screenshots
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p shots
          log() { echo "[$(date +%H:%M:%S)] $*"; }
          # run a command with a watchdog (seconds)
          wd() { local t=$1; shift; "$@" & local p=$!; ( sleep "$t"; kill -9 $p 2>/dev/null && echo "TIMEOUT: $*" ) & local w=$!; wait $p; local rc=$?; kill $w 2>/dev/null; return $rc; }
          xcrun simctl list runtimes
          log "using $UDID"
          sleep 20
          log "install"
          wd 120 xcrun simctl install "$UDID" simbuild/Build/Products/Debug-iphonesimulator/MoonAction.app
          shot() { log "shot $1"; wd 30 xcrun simctl io "$UDID" screenshot "shots/$1.png" || true; }
          run() { log "launch $1"; wd 60 xcrun simctl launch --terminate-running-process "$UDID" com.moonaction.game -demo "$1" -lang zh || true; }
          run home;     sleep 10; shot 1-home; sleep 2; shot 1b-home
          run team;     sleep 6;  shot 2-team
          run summon;   sleep 6;  shot 3-summon
          run battle;   sleep 5;  shot 4-battle-start; sleep 3; shot 5-battle-a; sleep 3; shot 6-battle-b; sleep 4; shot 7-battle-c
          run special;  sleep 3.3; shot 8-special-a; sleep 0.6; shot 9-special-b; sleep 0.8; shot 10-special-c
          run ultimate; sleep 4.8; shot 11-ult-cutin; sleep 1.4; shot 12-ult-fire; sleep 0.8; shot 13-ult-hit
          run result;   sleep 6;  shot 14-result
          ls -la shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Attach screenshots to release
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: shots/*.png
