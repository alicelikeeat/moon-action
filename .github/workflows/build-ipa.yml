name: Build unsigned IPA

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Liquid Glass SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild -project MoonAction.xcodeproj -target MoonAction -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          test -d build/Release-iphoneos/MoonAction.app || { grep -n "error:" build.log | head -80; exit 1; }

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/MoonAction.app Payload/
          zip -qry MoonAction-unsigned.ipa Payload
          ls -lh MoonAction-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonAction-unsigned-ipa
          path: MoonAction-unsigned.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: Moon Action v3.0.${{ github.run_number }} (unsigned IPA)
          target_commitish: ${{ github.sha }}
          files: MoonAction-unsigned.ipa
          body: |
            Unsigned iOS build of **Moon Action** — an original portrait 3D card battle game.

            * Portrait, over-the-shoulder 3D camera, procedurally generated cel-shaded fighters
            * Card system: Strike · Blast · Special Art · Ultimate Art · Effect cards · Eclipse Rush team finisher
            * Native iOS 26 Liquid Glass UI

            This IPA is **not signed**. Sideload it with a tool that re-signs the app
            (e.g. AltStore, Sideloadly, or TrollStore on supported devices). Requires iOS 15+.

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project MoonAction.xcodeproj -target MoonAction -configuration Debug -sdk iphonesimulator -arch arm64 \
            SYMROOT="$PWD/simbuild" CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -3

      - name: Simulator screenshots
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p shots
          log() { echo "[$(date +%H:%M:%S)] $*"; }
          # run a command with a watchdog (seconds)
          wd() { local t=$1; shift; "$@" & local p=$!; ( sleep "$t"; kill -9 $p 2>/dev/null && echo "TIMEOUT: $*" ) & local w=$!; wait $p; local rc=$?; kill $w 2>/dev/null; return $rc; }
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,dev) for rt,devs in d.items() if "iOS" in rt for dev in devs if "iPhone" in dev["name"] and "Pro" in dev["name"] and "Max" not in dev["name"]]
          c.sort(key=lambda x:x[0])
          print(c[-1][1]["udid"], c[-1][1]["name"], c[-1][0], file=sys.stderr)
          print(c[-1][1]["udid"])')
          log "boot $UDID"
          wd 240 xcrun simctl boot "$UDID" || true
          for i in $(seq 1 60); do
            st=$(xcrun simctl list devices | grep "$UDID" || true)
            echo "$st" | grep -q Booted && break
            sleep 3
          done
          log "booted: $st"
          sleep 20
          log "install"
          wd 120 xcrun simctl install "$UDID" simbuild/Debug-iphonesimulator/MoonAction.app
          shot() { log "shot $1"; wd 30 xcrun simctl io "$UDID" screenshot "shots/$1.png" || true; }
          run() { log "launch $1"; wd 60 xcrun simctl launch --terminate-running-process "$UDID" com.moonaction.game -demo "$1" -lang zh || true; }
          run home;     sleep 10; shot 1-home; sleep 2; shot 1b-home
          run team;     sleep 6;  shot 2-team
          run summon;   sleep 6;  shot 3-summon
          run battle;   sleep 5;  shot 4-battle-start; sleep 3; shot 5-battle-a; sleep 3; shot 6-battle-b; sleep 4; shot 7-battle-c
          run special;  sleep 3.3; shot 8-special-a; sleep 0.6; shot 9-special-b; sleep 0.8; shot 10-special-c
          run ultimate; sleep 4.8; shot 11-ult-cutin; sleep 1.4; shot 12-ult-fire; sleep 0.8; shot 13-ult-hit
          run result;   sleep 6;  shot 14-result
          ls -la shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Attach screenshots to release
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          files: shots/*.png
