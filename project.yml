name: MoonAction
options:
  bundleIdPrefix: com.moonaction
  deploymentTarget:
    iOS: "15.0"
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    exactVersion: 0.5.9
schemes:
  MoonAction:
    build:
      targets:
        MoonAction: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoonActionTests
    archive:
      config: Release
targets:
  MoonAction:
    type: application
    platform: iOS
    sources:
      - path: MoonAction
        excludes:
          - "Models/**"
      - path: MoonAction/Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: GLTFKit2
    settings:
      base:
        PRODUCT_NAME: MoonAction
        PRODUCT_BUNDLE_IDENTIFIER: com.moonaction.game
        MARKETING_VERSION: "3.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
    info:
      path: MoonAction/Info.plist
      properties:
        CFBundleDisplayName: Moon Action
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate

  MoonActionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoonActionTests
    dependencies:
      - target: MoonAction
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.moonaction.game.tests
        CODE_SIGNING_ALLOWED: NO
